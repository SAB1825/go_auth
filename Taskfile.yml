version: "3"

dotenv: [".env"]

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list
    silent: true

  goose:status:
    desc: Print the goose migration status
    cmds:
      - goose status

  goose:create:
    desc: "Create a new SQL migration (usage: task goose:create MIGRATION_NAME=create_users_table)"
    requires:
      vars:
        - MIGRATION_NAME
    cmds:
      - mkdir -p $GOOSE_MIGRATION_DIR
      - goose create {{.MIGRATION_NAME}} sql

  goose:up-all:
    desc: Apply all pending migrations
    cmds:
      - goose up

  goose:up-to:
    desc: "Migrate up to a version (usage: task goose:up-to VERSION=20261012201500)"
    requires:
      vars:
        - VERSION
    cmds:
      - goose up-to {{.VERSION}}

  goose:up-by-one:
    desc: Apply the next pending migration
    cmds:
      - goose up-by-one

  goose:down-by-one:
    desc: Roll back the most recent migration
    cmds:
      - goose down

  goose:down-to:
    desc: "Roll back to a version (usage: task goose:down-to VERSION=20261012201500)"
    requires:
      vars:
        - VERSION
    cmds:
      - goose down-to {{.VERSION}}

  goose:down-all:
    desc: Roll back all migrations
    prompt: This will roll back ALL migrations. Continue?
    cmds:
      - goose down-to 0